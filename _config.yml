# Site
title: Oniums
subtitle: 个人博客
description: Oniums 的个人博客，记录学习、工作与生活。
keywords:
  - Oniums
  - 个人博客
  - 学习
  - 工作
  - 生活
  - 技术
author: Oniums
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://oniums.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
future: false

# Markdown and code
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

# Category and tag
default_category: 技术笔记
category_map:
tag_map:

# Date and pagination
date_format: YYYY-MM-DD
time_format: HH:mm:ss
per_page: 10
pagination_dir: page

# Theme
theme: butterfly

# Generators
index_generator:
  path: ""
  per_page: 10
  order_by: -date

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true

sitemap:
  path: sitemap.xml

search:
  path: local-search.xml
  field: all
  content: true
  format: html
