# Oniums Butterfly theme overrides.
# Keep this file focused on site-specific choices so theme upgrades remain manageable.

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  文章:
    归档: /archives/ || fas fa-box-archive
    分类: /categories/ || fas fa-folder-open
    标签: /tags/ || fas fa-tags
  项目: /projects/ || fas fa-microchip
  经历: /experience/ || fas fa-route
  关于: /about/ || fas fa-user

code_blocks:
  theme: darker
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: true

social:
  fab fa-github: https://github.com/Oniums || GitHub || '#24292f'
  fas fa-envelope: mailto:237791949@qq.com || Email || '#0f766e'

favicon: /img/avatar.png

avatar:
  img: /img/avatar.png
  effect: false

disable_top_img: false
default_top_img: false
index_img: /img/banner.jpg
archive_img: false
tag_img: false
category_img: false
footer_img: false

background: '#f3f6f8'

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover:

error_404:
  enable: true
  subtitle: 页面没有找到，正在返回首页
  background: /img/banner.jpg

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true

index_site_info_top: 48%
index_top_img_height: 420px

subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 嵌入式固件 · 无线协议 · 可验证的工程实践

index_layout: 4

index_post_content:
  method: 3
  length: 220

toc:
  post: true
  page: false
  number: false
  expand: false
  style_simple: true
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/Oniums
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false

related_post:
  enable: true
  limit: 4
  date_type: created

post_pagination: 1

noticeOutdate:
  enable: true
  style: flat
  limit_day: 540
  position: top
  message_prev: 本文发布距今已超过
  message_next: 天，工具版本与生态行为可能已经变化。

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: 用代码、日志、抓包与构建结果建立证据链

aside:
  enable: true
  hide: false
  button: true
  mobile: false
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 嵌入式固件、无线协议与工程实践
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/Oniums
  card_announcement:
    enable: true
    content: 把复杂系统拆成可以验证的证据链。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: false
  card_archives:
    enable: false
  card_post_series:
    enable: true
    series_title: false
    orderBy: date
    order: 1
  card_webinfo:
    enable: false

readmode: true

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

rightside_scroll_percent: true
rightside_config_animation: false

copy:
  enable: true
  copyright:
    enable: false

wordcount:
  enable: false

busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

math:
  use:
  per_page: false

search:
  use: local_search
  placeholder: 搜索协议、固件与工程实践
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8

share:
  use:

comments:
  use:
  text: false
  lazyload: true
  count: false
  card_post_count: false

theme_color:
  enable: true
  main: '#2563eb'
  paginator: '#2563eb'
  button_hover: '#0f766e'
  text_selection: '#bfdbfe'
  link_color: '#2563eb'
  meta_color: '#64748b'
  hr_color: '#cbd5e1'
  code_foreground: '#0f766e'
  code_background: 'rgba(37, 99, 235, 0.08)'
  toc_color: '#0f766e'
  blockquote_padding_color: '#0f766e'
  blockquote_background_color: 'rgba(15, 118, 110, 0.08)'
  scrollbar_color: '#2563eb'
  meta_theme_color_light: '#f3f6f8'
  meta_theme_color_dark: '#0b1220'

category_ui: default
tag_ui: default
rounded_corners_ui: true
text_align_justify: false

mask:
  header: true
  footer: true

preloader:
  enable: false

enter_transitions: true
display_mode: light

font:
  global_font_size: 16px
  code_font_size: 0.9rem
  font_family: 'Inter, "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  code_font_family: '"JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace'

blog_title_font:
  font_link:
  font_family: '"JetBrains Mono", Inter, sans-serif'

hr_icon:
  enable: false

activate_power_mode:
  enable: false
canvas_ribbon:
  enable: false
canvas_fluttering_ribbon:
  enable: false
canvas_nest:
  enable: false
fireworks:
  enable: false
click_heart:
  enable: false
clickShowText:
  enable: false

lightbox: medium_zoom

series:
  enable: true
  orderBy: date
  order: 1
  number: true

mermaid:
  enable: true
  code_write: true
  theme:
    light: neutral
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

note:
  style: flat
  icons: true
  border_radius: 8

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
